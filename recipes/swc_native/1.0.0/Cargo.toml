[package]
name = "swc_native"
version = "1.0.0"
edition = "2021"
description = "SWC TypeScript compiler C FFI wrapper"
license = "MIT"

[lib]
name = "swc_native"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Use latest swc_core with all needed features
swc_core = { version = "54", features = [
    "ecma_parser",
    "ecma_transforms_typescript",
    "ecma_codegen",
    "common",
    "__visit"
] }
swc_ecma_parser = "32"
swc_ecma_ast = "19"
swc_ecma_codegen = "21"
swc_ecma_transforms_typescript = "38"
swc_ecma_visit = "19"
swc_common = { version = "18", features = ["sourcemap"] }
sourcemap = "9"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
