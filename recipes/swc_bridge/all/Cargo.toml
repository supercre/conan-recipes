[package]
name = "ssr_swc_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[dependencies]
serde_json = "1"
swc = "62.0.0"
swc_common = "21.0.1"
swc_ecma_transforms_base = { version = "42.0.0", features = ["inline-helpers"] }
